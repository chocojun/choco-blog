<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floscas Snake</title>
  <link rel="stylesheet" href="../floscas-games.css">
</head>
<body>
  <main class="game-shell">
    <nav class="game-nav"><a href="/">Floscas</a><span>Offline game</span></nav>
    <h1 class="game-title">Snake</h1>
    <section class="game-panel">
      <p class="muted">Arrow keys or swipe. A small neon line through glass.</p>
      <div class="game-actions"><button id="new">Restart</button><strong id="score">Score 0</strong></div>
      <canvas id="game" width="520" height="520"></canvas>
    </section>
  </main>
  <script>
  const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score");
  const n=20,s=canvas.width/n; let snake,food,dir,next,score,start;
  const spawn=()=>food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)};
  const reset=()=>{snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}]; dir={x:1,y:0}; next=dir; score=0; spawn();};
  const drawCell=(p,c)=>{ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=14;ctx.fillRect(p.x*s+3,p.y*s+3,s-6,s-6);ctx.shadowBlur=0;};
  const frame=()=>{dir=next; const head={x:(snake[0].x+dir.x+n)%n,y:(snake[0].y+dir.y+n)%n}; if(snake.some(p=>p.x===head.x&&p.y===head.y)) reset(); snake.unshift(head); if(head.x===food.x&&head.y===food.y){score++;spawn();} else snake.pop(); ctx.clearRect(0,0,canvas.width,canvas.height); drawCell(food,"rgba(235,242,235,.92)"); snake.forEach((p,i)=>drawCell(p,i?"rgba(128,170,150,.72)":"rgba(236,242,236,.95)")); scoreEl.textContent=`Score ${score}`;};
  addEventListener("keydown",e=>{
    const m={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}}[e.key];
    if(!m) return;
    e.preventDefault();
    if(m.x!==-dir.x||m.y!==-dir.y) next=m;
  }, { passive: false });
  addEventListener("touchstart",e=>start=[e.touches[0].clientX,e.touches[0].clientY],{passive:true});
  addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-start[0],dy=e.changedTouches[0].clientY-start[1]; next=Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1};},{passive:true});
  document.getElementById("new").onclick=reset; reset(); setInterval(frame,120);
  </script>
</body>
</html>
