baseURL = "https://choco-blog-20l.pages.dev/"
languageCode = "zh-cn"
title = "Choco's Blog"
theme = "PaperMod"

[outputs]
home = ["HTML", "RSS"]

[params]
env = "production"
description = "A quiet place for essays, poems, notes, and becoming."
author = "Choco's Blog"
defaultTheme = "light"
mainSections = ["posts"]
DateFormat = "2006-01-02"
ShowReadingTime = true
ShowWordCount = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
disableSpecial1stPost = true

[params.label]
text = "Choco's Blog"

[params.homeInfoParams]
Title = "Choco's Blog"
Content = "Writing my thoughts, recording my loves."
ImageUrl = "/images/avatar.svg"
ImageTitle = "Choco's Blog"

[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/chocojun"

[[params.socialIcons]]
name = "rss"
title = "RSS"
url = "/index.xml"

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 5

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "essays"
name = "Essays"
url = "/essays/"
weight = 20

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 30

[[menu.main]]
identifier = "gallery"
name = "Gallery"
url = "/gallery/"
weight = 40
