baseURL = "https://choco-blog-20l.pages.dev/"
locale = "zh-cn"
title = "Floscas"
theme = "PaperMod"

[outputs]
home = ["HTML", "RSS"]

[params]
env = "production"
description = "A quiet place for essays, poems, notes, and becoming."
author = "Floscas"
defaultTheme = "light"
mainSections = ["posts"]
DateFormat = "2006-01-02"
ShowReadingTime = true
ShowWordCount = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
disableSpecial1stPost = true

[params.label]
text = "Floscas"

[params.homeInfoParams]
Title = "Floscas"
Content = "Writing my thoughts, recording my loves."
ImageUrl = "/images/avatar.svg"
ImageTitle = "Floscas"

[params.assets]
favicon = "images/avatar.svg"
favicon16x16 = "images/avatar.svg"
favicon32x32 = "images/avatar.svg"
apple_touch_icon = "images/avatar.svg"
safari_pinned_tab = "images/avatar.svg"

[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/chocojun"

[[params.socialIcons]]
name = "rss"
title = "RSS"
url = "/index.xml"

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 5

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "essays"
name = "Essays"
url = "/essays/"
weight = 20

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 30

[[menu.main]]
identifier = "gallery"
name = "Gallery"
url = "/gallery/"
weight = 40
