name: Build Floscas Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "static/admin/**"
      - "mobile-admin/android/**"
      - ".github/workflows/build-floscas-studio-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Copy the mobile studio into Android assets
        run: |
          mkdir -p mobile-admin/android/app/src/main/assets
          cp static/admin/index.html mobile-admin/android/app/src/main/assets/index.html
          cp static/admin/studio.css mobile-admin/android/app/src/main/assets/studio.css
          cp static/admin/studio.js mobile-admin/android/app/src/main/assets/studio.js
          cp static/admin/manifest.webmanifest mobile-admin/android/app/src/main/assets/manifest.webmanifest

      - name: Build installable debug APK
        working-directory: mobile-admin/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floscas-studio-apk
          path: mobile-admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
